name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -I -S -m unittest discover -s tests -v
      - run: python -I -S scripts/observatory.py verify-signals --portable
      - run: python -I -S scripts/audit_public.py
      - run: node scripts/check-js.js
      - run: node --test tests/composition.test.js
      - run: git diff --check
